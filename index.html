<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Rep Timer">
<meta name="theme-color" content="#fbf8fd">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@300;400;500&family=Pinyon+Script&display=swap" rel="stylesheet">
<title>Rep Timer</title>
<style>
/* VOICE: calm, graceful studio; Graceful Aging Movement brand
   IDEA: a Pilates studio wall clock, airy but readable across the room
   PICTURE: the giant countdown itself, each phase a soft full screen brand colour
   COLOUR and TYPE: white and lilac mist, GAM indigo #4c489e, lavender, blush #f0c1b7, plum #8d30ba; Cormorant Garamond + Jost, Pinyon Script brandmark
   LAYOUT: one column, big targets, sticky save bar */
:root{color-scheme:light;--bg:#fbf8fd;--card:#fff;--line:#ebe3f3;--text:#2f2b4a;--mute:#8a80a3;--acc:#4c489e;--blush:#f0c1b7;--lav:#d9c9ef;--plum:#8d30ba;--soft:#f4eef9}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--text);font:16px/1.5 "Jost",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;transition:background .4s,color .4s;overflow-x:clip}
body[data-phase=ready]{background:#f4eef9;color:#4c489e}
body[data-phase=work]{background:#4c489e;color:#fff}
body[data-phase=rest]{background:#d9c9ef;color:#2f2b6e}
body[data-phase=transition]{background:#f0c1b7;color:#3d2a5c}
body[data-phase=count]{background:#8d30ba;color:#fff}
body[data-phase=done]{background:#fff;color:#4c489e}
.wrap{max-width:640px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 18px) 18px calc(env(safe-area-inset-bottom) + 24px)}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:18px}
.brandmark{font-family:"Pinyon Script",cursive;font-size:22px;color:#c98f84;line-height:1}
h1{font-family:"Cormorant Garamond",Georgia,serif;font-weight:500;font-size:40px;margin:0;letter-spacing:.06em;text-transform:uppercase;color:var(--acc);line-height:1.05}
h2{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;font-size:24px;margin:0;color:var(--acc)}
button{font:inherit;color:var(--acc);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:10px 18px;cursor:pointer;min-height:44px}
button:focus-visible,input:focus-visible{outline:2px solid var(--plum);outline-offset:2px}
button:disabled{opacity:.35}
button.primary{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:500;letter-spacing:.04em}
button.danger{color:#b4475c}
button.icon{width:44px;padding:0;font-size:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:14px;box-shadow:0 6px 20px rgba(76,72,158,.06)}
.wname{font-family:"Cormorant Garamond",Georgia,serif;font-size:24px;font-weight:600;color:var(--acc);line-height:1.15}
.desc{font-size:15px;color:var(--text);margin-top:2px}
.meta{color:var(--mute);font-size:13px;margin:3px 0 14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.seg{display:flex;background:var(--soft);border-radius:999px;padding:4px;gap:4px;margin-top:10px}
.seg button{flex:1;border:0;background:transparent;padding:6px 8px;font-size:14px;min-height:38px;color:var(--mute)}
.seg button.on{background:#fff;color:var(--acc);font-weight:500;box-shadow:0 2px 8px rgba(76,72,158,.14)}
input[type=text],input[type=number]{width:100%;font:inherit;font-size:16px;color:var(--text);background:var(--soft);border:1px solid transparent;border-radius:12px;padding:10px 12px}
input[type=text]:focus,input[type=number]:focus{background:#fff;border-color:var(--lav)}
input[type=range]{width:100%;accent-color:var(--acc)}
.fld{display:block;margin-top:12px}
.fld>span{display:block;font-size:13px;color:var(--mute);margin-bottom:4px}
.fld small{display:block;color:var(--mute);font-size:12px;margin-top:3px;min-height:15px}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 12px}
.exhead{display:flex;gap:6px;align-items:center}
.exhead input{font-family:"Cormorant Garamond",Georgia,serif;font-size:20px;font-weight:600;color:var(--acc)}
.exhead button{width:40px;padding:0;flex:none}
.section{font-family:"Cormorant Garamond",Georgia,serif;font-size:20px;font-weight:600;color:var(--acc);margin:24px 0 8px}
.note{color:var(--mute);font-size:14px;margin:10px 0 0}
.sticky{position:sticky;bottom:0;padding:14px 0 calc(env(safe-area-inset-bottom) + 6px);background:linear-gradient(transparent,var(--bg) 35%);display:flex;gap:8px}
.sticky button{flex:1}
.run{height:100vh;height:100dvh;display:flex;flex-direction:column;align-items:center;text-align:center;padding:calc(env(safe-area-inset-top) + 10px) 18px calc(env(safe-area-inset-bottom) + 14px);user-select:none;-webkit-user-select:none}
.runtop{width:100%;display:flex;align-items:center;gap:10px}
.runtop button,.controls button{background:color-mix(in srgb,currentColor 14%,transparent);border:0;color:inherit}
.runtop button{width:44px;padding:0;font-size:18px}
.rt-name{flex:1;font-family:"Cormorant Garamond",Georgia,serif;font-size:20px;font-weight:600;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rt-step{opacity:.8;font-variant-numeric:tabular-nums}
.phase{margin-top:2vh;font-size:clamp(16px,4.4vw,22px);font-weight:500;letter-spacing:.28em;text-transform:uppercase;opacity:.85}
.title{font-family:"Cormorant Garamond",Georgia,serif;font-size:clamp(34px,9vw,58px);font-weight:600;line-height:1.05;margin-top:4px;text-wrap:balance}
.sub{font-size:clamp(17px,4.6vw,22px);opacity:.9;margin-top:6px;min-height:1.3em}
.mid{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;width:100%}
.big{font-family:"Jost",sans-serif;font-size:min(44vw,36vh);font-weight:300;line-height:.95;font-variant-numeric:tabular-nums;letter-spacing:-.03em;transition:opacity .2s}
.big.long{font-size:min(30vw,28vh)}
.tempo{font-size:clamp(20px,6vw,30px);font-weight:500;min-height:1.3em;margin-top:8px}
.of{font-size:clamp(20px,6vw,28px);font-weight:400;opacity:.92}
.hint{opacity:.85;margin-top:10px}
.cue{font-size:clamp(15px,4vw,19px);opacity:.88;margin-top:8px;max-width:520px;line-height:1.35}
.seg.pace button{font-size:13px}
.nextcard .cue{font-size:15px;margin-top:4px}
.run.paused .big{opacity:.35}
.nextcard{background:color-mix(in srgb,currentColor 12%,transparent);border-radius:22px;padding:12px 18px;width:100%;max-width:520px;margin-bottom:14px}
.nextcard span{display:block;font-size:12px;font-weight:500;letter-spacing:.22em;text-transform:uppercase;opacity:.8}
.nextcard b{display:block;font-family:"Cormorant Garamond",Georgia,serif;font-size:clamp(26px,7vw,36px);font-weight:600;line-height:1.1}
.controls{display:flex;gap:14px;justify-content:center;width:100%;margin-bottom:14px}
.controls button{width:72px;height:60px;font-size:22px;border-radius:999px;padding:0}
.controls button.main{width:110px}
.bar{width:100%;height:4px;background:color-mix(in srgb,currentColor 18%,transparent);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:currentColor;width:0}
.donebox{flex:1;display:flex;flex-direction:column;justify-content:center;gap:12px;width:100%;max-width:420px}
.donebox .big{font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-weight:500;font-size:clamp(56px,16vw,96px);letter-spacing:0}
.donebox .brandmark{font-size:28px}
.modal{position:fixed;inset:0;background:rgba(47,43,74,.45);display:flex;align-items:center;justify-content:center;padding:20px;z-index:9}
.mbox{background:#fff;border-radius:22px;padding:20px;max-width:380px;width:100%;color:var(--text)}
.mbox p{margin:0 0 14px;font-size:17px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 90px);transform:translateX(-50%);background:var(--acc);color:#fff;padding:10px 18px;border-radius:999px;z-index:10;font-size:15px}
textarea{width:100%;height:120px;font:12px/1.4 ui-monospace,Menlo,monospace;background:var(--soft);color:var(--text);border:0;border-radius:12px;padding:8px}
@media (prefers-reduced-motion:reduce){body{transition:none}}
</style>
</head>
<body>
<div id="app"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>
<script>
{
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const clone=o=>JSON.parse(JSON.stringify(o));
const LS='repTimer.v1';
const defaultSettings={voice:true,overMusic:true,volume:0.8,ready:5};

function mkEx(name,type,o){return Object.assign({id:uid(),name,type,work:40,rest:20,sets:3,reps:10,tempo:'',repSec:3,cue:'',sides:false},o||{});}
const PDESC={p_4x4:'Cardio intervals: 4 hard minutes, 3 easy, four times.',p_tabata:'20 seconds all out, 10 seconds rest, 8 rounds.',p_emom:'Do your reps at the top of each minute, rest the remainder.',p_lower:'Sample mixing tempo squats, counted leg lifts and timed bridges.',p_circuit:'Squats, push ups and plank, 40 seconds each, 3 rounds.',p_ski_daily:'Every day, about 3 minutes. Goal: no wall by the trip.',p_ski_a:'Monday (and Friday, weeks 1 and 2). Quads that brake, knees that track.',p_ski_b:'Wednesday. Hip stability, quick balance and core.',p_ski_c:'Friday from week 3. Ski run circuit: 30 on, 15 off, 3 rounds.'};
const descOf=w=>w.desc!=null?w.desc:(PDESC[w.id]||'');
function presets(){return [
 {id:'p_4x4',name:'Norwegian 4x4',mode:'sets',circuitRounds:3,roundRest:60,transition:0,exercises:[mkEx('Warm up','timed',{work:600,sets:1,rest:0}),mkEx('High intensity','timed',{work:240,rest:180,sets:4}),mkEx('Cool down','timed',{work:300,sets:1,rest:0})]},
 {id:'p_tabata',name:'Tabata',mode:'sets',circuitRounds:3,roundRest:60,transition:60,exercises:[mkEx('Tabata','timed',{work:20,rest:10,sets:8})]},
 {id:'p_emom',name:'EMOM 10',mode:'sets',circuitRounds:3,roundRest:60,transition:0,exercises:[mkEx('Every minute','timed',{work:60,rest:0,sets:10})]},
 {id:'p_lower',name:'Lower body strength',mode:'sets',circuitRounds:3,roundRest:60,transition:60,exercises:[mkEx('Squats','tempo',{reps:10,tempo:'3 1 2',rest:30,sets:3}),mkEx('Single leg lifts','count',{reps:12,rest:20,sets:2}),mkEx('Glute bridges','timed',{work:40,rest:20,sets:3})]},
 {id:'p_circuit',name:'Quick circuit',mode:'circuit',circuitRounds:3,roundRest:60,transition:15,exercises:[mkEx('Squats','timed',{work:40}),mkEx('Push ups','timed',{work:40}),mkEx('Plank','timed',{work:40})]},
 {id:'p_ski_daily',name:'Ski Ready: Daily hip CARs',mode:'sets',circuitRounds:3,roundRest:60,transition:0,exercises:[
  mkEx('Standing hip CARs','tempo',{repSec:6,reps:10,sets:1,sides:true,cue:'5 slow circles each direction, one per click. Use less wall each week; no hand by the trip.'})]},
 {id:'p_ski_a',name:'Ski Ready A: Legs and Brakes',mode:'sets',circuitRounds:3,roundRest:60,transition:45,exercises:[
  mkEx('Footwork warm up','tempo',{repSec:2,reps:50,sets:1,cue:'Reformer, medium springs. Change position every 10 reps: heels, toes, V, wide second, prances.'}),
  mkEx('Single leg footwork, heel and toes','tempo',{repSec:5,reps:10,sets:2,rest:30,sides:true,cue:'Reformer, medium to heavy. Press out in 1, return in 4. Knee over second toe.'}),
  mkEx('Going Up Front','tempo',{repSec:5,reps:6,sets:2,rest:30,sides:true,cue:'Wunda chair, light spring. Lower the pedal slowly; keep the standing hip level.'}),
  mkEx('Slow split squat','tempo',{reps:8,tempo:'4 0 1',sets:2,rest:30,sides:true,cue:'Dumbbells. Shin angled forward like in a ski boot. Add a 3rd set when it feels easy.'}),
  mkEx('Standing side splits','tempo',{repSec:4,reps:8,sets:2,rest:30,cue:'Reformer, light. Control the carriage both ways; this is your snowplow brake.'}),
  mkEx('Wall sit, band above knees','timed',{work:30,sets:3,rest:30,cue:'Press knees out into the band. Hold by week: 30s, 45s, 60s, 75 to 90s, then 60s in trip week.'}),
  mkEx('Pallof press in quarter squat','tempo',{repSec:4,reps:8,sets:2,rest:30,sides:true,cue:'Band. Hold 2 seconds at full reach; ribs and hips stay square.'})]},
 {id:'p_ski_b',name:'Ski Ready B: Hips, Balance and Core',mode:'sets',circuitRounds:3,roundRest:60,transition:45,exercises:[
  mkEx('Footwork warm up','tempo',{repSec:2,reps:50,sets:1,cue:'Reformer, medium springs. Change position every 10 reps: heels, toes, V, wide second, prances.'}),
  mkEx('Side lying clam and leg lift','tempo',{repSec:3,reps:12,sets:2,rest:20,sides:true,cue:'Band above knees. Pelvis stacked; no rolling back.'}),
  mkEx('Lateral walks in quarter squat','tempo',{repSec:2,reps:10,sets:2,rest:20,sides:true,cue:'Band at ankles. 10 steps each way. Stay low; knees out over toes.'}),
  mkEx('Standing skater','tempo',{repSec:3,reps:8,sets:2,rest:20,sides:true,cue:'Reformer, light. One foot on platform, one on carriage. Push with the hip, not the knee.'}),
  mkEx('Ski stance on wobble board','timed',{work:30,sets:3,rest:20,cue:'Knees and ankles bent, shins forward, arms in front.'}),
  mkEx('Slow side to side tilts','tempo',{repSec:4,reps:10,sets:2,rest:20,cue:'Wobble board. Tip edge to edge like rolling onto ski edges.'}),
  mkEx('Single leg balance','timed',{work:20,sets:2,rest:15,sides:true,cue:'Wobble board or floor. Build to 30 seconds. Eyes closed once it is easy on the floor.'}),
  mkEx('Wedge weight shifts','timed',{work:60,sets:3,rest:30,cue:'Wide bent knee wedge; shift slowly onto one leg, then the other. Stop if the hip pinches.'}),
  mkEx('Side plank','timed',{work:20,sets:2,rest:20,sides:true,cue:'Build to 30 seconds. Add a top leg lift in week 3.'})]},
 {id:'p_ski_c',name:'Ski Ready C: Endurance Circuit',mode:'circuit',circuitRounds:3,roundRest:90,transition:15,exercises:[
  mkEx('Quarter squat hold','timed',{work:30,cue:'On the wobble board.'}),
  mkEx('Jump board, small parallel jumps','timed',{work:30,cue:'Reformer, light springs. Or skater hops on the floor, low and soft.'}),
  mkEx('Going Up Front, alternating','timed',{work:30,cue:'Wunda chair. Alternate legs.'}),
  mkEx('Wedge weight shifts','timed',{work:30,cue:'Wide bent knee wedge; shift slowly side to side.'}),
  mkEx('Pallof press in quarter squat','timed',{work:30,cue:'Switch sides at the halfway tick.'}),
  mkEx('Wall sit, band above knees','timed',{work:30,cue:'Press knees out into the band.'})]}
];}
function load(){try{const d=JSON.parse(localStorage.getItem(LS));if(d&&Array.isArray(d.workouts))return d;}catch(e){}return null;}
function save(){try{localStorage.setItem(LS,JSON.stringify(db));}catch(e){}}
let db=load()||{workouts:presets(),settings:{}};
db.settings=Object.assign({},defaultSettings,db.settings||{});
if((db.presetVer||1)<2){const fresh=presets();db.workouts=db.workouts.map(w=>/^p_ski_/.test(w.id)?(fresh.find(p=>p.id===w.id)||w):w);db.presetVer=2;}
save();

let view='home',draft=null,draftIsNew=false,R=null,timer=null;
const app=$('#app');

/* ---------- audio ---------- */
let ac=null,master=null;
function applyAudioSession(){try{if(navigator.audioSession)navigator.audioSession.type=db.settings.overMusic?'ambient':'playback';}catch(e){}}
function audioInit(){
 applyAudioSession();
 try{
  if(!ac){const C=window.AudioContext||window.webkitAudioContext;if(!C)return;ac=new C();master=ac.createGain();master.connect(ac.destination);}
  master.gain.value=db.settings.volume;
  if(ac.state!=='running')ac.resume();
 }catch(e){}
}
function tone(f,t0,d,type,g){
 if(!ac)return;
 try{const o=ac.createOscillator(),v=ac.createGain();o.type=type||'sine';o.frequency.value=f;const t=ac.currentTime+t0;
 v.gain.setValueAtTime(0.0001,t);v.gain.exponentialRampToValueAtTime(g||0.6,t+0.012);v.gain.exponentialRampToValueAtTime(0.0001,t+d);
 o.connect(v);v.connect(master);o.start(t);o.stop(t+d+0.05);}catch(e){}
}
function click(freq,g){
 if(!ac)return;
 try{const n=Math.floor(ac.sampleRate*0.03),buf=ac.createBuffer(1,n,ac.sampleRate),d=buf.getChannelData(0);
 for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,4);
 const src=ac.createBufferSource(),bp=ac.createBiquadFilter(),v=ac.createGain();src.buffer=buf;bp.type='bandpass';bp.frequency.value=freq;bp.Q.value=4;v.gain.value=(g||0.8)*2.2;
 src.connect(bp);bp.connect(v);v.connect(master);src.start();}catch(e){}
}
const SND={
 work(){tone(880,0,0.12,'square',0.32);tone(1320,0.16,0.24,'square',0.32);},
 rest(){tone(392,0,0.75,'sine',0.85);},
 transition(){tone(784,0,0.2,'triangle',0.75);tone(659,0.22,0.2,'triangle',0.75);tone(523,0.44,0.38,'triangle',0.75);},
 half(){tone(1600,0,0.05,'sine',0.35);tone(1600,0.12,0.05,'sine',0.35);},
 tick(name){click({Down:1100,Hold:1700,Up:2600,Rep:2000}[name]||2000,name==='Rep'?0.9:0.7);},
 tap(){tone(1000,0,0.05,'square',0.25);},
 done(){[523,659,784,1047].forEach((f,i)=>tone(f,i*0.15,0.32,'triangle',0.7));}
};
function unlockSpeech(){try{if('speechSynthesis' in window){const u=new SpeechSynthesisUtterance(' ');u.volume=0;speechSynthesis.speak(u);}}catch(e){}}
function say(t){if(!t||!db.settings.voice||!('speechSynthesis' in window))return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.rate=1.05;speechSynthesis.speak(u);}catch(e){}}
function hush(){try{speechSynthesis.cancel();}catch(e){}}

/* ---------- wake lock ---------- */
let wl=null;
async function wake(){try{if('wakeLock' in navigator)wl=await navigator.wakeLock.request('screen');}catch(e){}}
function unwake(){try{if(wl)wl.release();}catch(e){}wl=null;}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&R&&!R.done){wake();if(ac&&ac.state!=='running')ac.resume();}});

/* ---------- workout logic ---------- */
const PNAMES={1:['Rep'],2:['Down','Up'],3:['Down','Hold','Up'],4:['Down','Hold','Up','Hold']};
function tempoParts(e){const p=String(e.tempo||'').trim().split(/[^0-9]+/).filter(Boolean).map(Number);return p.length&&p.reduce((a,b)=>a+b,0)>0?p:null;}
const PACE={slow:1.4,medium:1,fast:0.7};
const pf=w=>PACE[w&&w.pace]||1;
function workDur(e,f){f=f||1;
 if(e.type==='timed')return +e.work||0;
 if(e.type==='tempo'){const p=tempoParts(e);return (+e.reps||0)*(p?p.reduce((a,b)=>a+b,0):Math.round((+e.repSec||0)*f*10)/10);}
 return null;
}
function buildSteps(w,noReady){
 const S=[],X=w.exercises;
 const push=s=>{if(s.phase==='count'||s.dur>0)S.push(s);};
 const f=pf(w),mk=(e,info)=>Object.assign({phase:e.type==='count'?'count':'work',ex:e,title:e.name||'Exercise',dur:workDur(e,f),pf:f},info);
 const tr=+w.transition||0;
 if(w.mode==='circuit'){
  const RR=Math.max(1,+w.circuitRounds||1);
  for(let r=1;r<=RR;r++){
   X.forEach((e,i)=>{push(mk(e,{round:r,rounds:RR}));if(i<X.length-1)push({phase:'transition',title:'Rest',dur:tr});});
   if(r<RR)push({phase:'rest',title:'Round rest',dur:+w.roundRest||0});
  }
 }else{
  X.forEach((e,i)=>{
   const n=Math.max(1,+e.sets||1);
   for(let s=1;s<=n;s++){
    if(e.sides){push(mk(e,{set:s,sets:n,side:'Right'}));push({phase:'rest',title:'Switch sides',dur:5,sw:true});push(mk(e,{set:s,sets:n,side:'Left'}));}
    else push(mk(e,{set:s,sets:n}));
    if(s<n)push({phase:'rest',title:'Rest',dur:+e.rest||0});}
   if(i<X.length-1)push({phase:'transition',title:'Rest',dur:tr});
  });
 }
 let nx=null;for(let i=S.length-1;i>=0;i--){S[i].next=nx;if(S[i].phase==='work'||S[i].phase==='count')nx=S[i];}
 if(!noReady&&+db.settings.ready>0&&S.length)S.unshift({phase:'ready',title:'Get ready',dur:+db.settings.ready,next:nx});
 return S;
}
const fmt=t=>t>=60?Math.floor(t/60)+':'+String(t%60).padStart(2,'0'):String(t);
const fmtLong=t=>t>=60?Math.round(t/60)+' min':t+' sec';
function subText(s){
 if(!s||!s.ex)return '';
 const p=[];if(s.sets>1)p.push(`Set ${s.set} of ${s.sets}`);if(s.rounds>1)p.push(`Round ${s.round} of ${s.rounds}`);if(s.side)p.push(`${s.side} side`);
 if(s.ex.type==='count')p.push(`${s.ex.reps} reps`);
 if(s.ex.type==='tempo'){const tp=tempoParts(s.ex);p.push(`${s.ex.reps} reps`+(tp?`, tempo ${tp.join(' ')}`:''));}

}
function spokenDur(t){if(t>=60){const m=Math.floor(t/60),r=t%60;return `${m} minute${m>1?'s':''}${r?` ${r} seconds`:''}`;}return `${t} seconds`;}
function spokenEx(s){let t=s.title;if(s.sets>1)t+=`, set ${s.set} of ${s.sets}`;if(s.rounds>1)t+=`, round ${s.round} of ${s.rounds}`;if(s.side)t+=`, ${s.side.toLowerCase()} side`;if(s.ex.type!=='timed')t+=`, ${s.ex.reps} reps`;return t;}
function speech(s){
 switch(s.phase){
  case 'ready':return s.next?`Get ready. First up, ${spokenEx(s.next)}.`:'Get ready.';
  case 'work':return spokenEx(s)+'.';
  case 'count':return spokenEx(s)+'. Tap for each rep.';
  case 'rest':if(s.sw)return 'Switch sides.';return `Rest, ${spokenDur(s.dur)}.`+(s.next?` Next, ${spokenEx(s.next)}.`:'');
  case 'transition':return `Rest, ${spokenDur(s.dur)}.`+(s.next?` Next up, ${spokenEx(s.next)}.`:'');
 }return '';
}
function tempoInfo(s,el){
 const e=s.ex,tp=tempoParts(e),p=tp||[Math.max(0.5,(+e.repSec||3)*(s.pf||1))];
 const L=p.reduce((a,b)=>a+b,0),reps=Math.max(1,+e.reps||1);
 const rep=Math.min(reps-1,Math.floor(el/L));let t=el-rep*L,k=0;
 while(k<p.length-1&&t>=p[k]){t-=p[k];k++;}
 const names=PNAMES[p.length];return {rep,k,has:!!tp,name:names?names[k]:'Phase '+(k+1)};
}

/* ---------- runner ---------- */
function startWorkout(w){
 audioInit();unlockSpeech();
 const steps=buildSteps(w);
 if(!steps.length){toast('Add an exercise first');return;}
 R={w,steps,idx:0,paused:false,done:false,startedAt:Date.now()};
 view='run';wake();go(0);
 clearInterval(timer);timer=setInterval(loop,100);
}
function cue(s){
 const snd={work:'work',count:'work',rest:'rest',transition:'transition'}[s.phase];
 if(snd)SND[snd]();
 const d=snd==='transition'?950:snd?650:0,txt=speech(s);
 clearTimeout(R.sayT);R.sayT=setTimeout(()=>say(txt),d);
}
function go(i){
 if(!R)return;clearTimeout(R.sayT);
 if(i<0)i=0;
 if(i>=R.steps.length){finish();return;}
 R.idx=i;R.t0=performance.now();R.pausedAt=R.t0;R.half=false;R.tempoKey=-1;R.count=0;
 cue(R.steps[i]);render();
}
function elapsed(){return ((R.paused?R.pausedAt:performance.now())-R.t0)/1000;}
function loop(){
 if(!R||R.paused||R.done)return;
 const s=R.steps[R.idx];if(!s)return;
 if(s.phase!=='count'){
  const el=elapsed();
  if(el>=s.dur){
   let over=el-s.dur,i=R.idx+1;
   while(i<R.steps.length&&R.steps[i].phase!=='count'&&over>=R.steps[i].dur){over-=R.steps[i].dur;i++;}
   go(i);if(R&&!R.done)R.t0-=over*1000;return;
  }
  if(!R.half&&s.dur>=6&&el>=s.dur/2){R.half=true;SND.half();}
  if(s.phase==='work'&&s.ex.type==='tempo'){
   const ti=tempoInfo(s,el),key=ti.rep*10+ti.k;
   if(key!==R.tempoKey){R.tempoKey=key;if(key!==0)SND.tick(ti.has?ti.name:'Rep');}
  }
 }
 updateRun();
}
function countTap(){
 const s=R.steps[R.idx],reps=Math.max(1,+s.ex.reps||1);
 if(R.count>=reps)return;
 R.count++;SND.tap();updateRun();
 if(R.count>=reps)setTimeout(()=>{if(R&&!R.done&&R.steps[R.idx]===s)go(R.idx+1);},350);
}
function togglePause(){
 if(R.paused){R.t0+=performance.now()-R.pausedAt;R.paused=false;if(ac&&ac.state!=='running')ac.resume();}
 else{R.paused=true;R.pausedAt=performance.now();hush();}
 updateRun();
}
function finish(){R.done=true;clearInterval(timer);SND.done();setTimeout(()=>say('Workout complete. Nice work.'),700);unwake();render();}
function stopRun(){clearInterval(timer);if(R)clearTimeout(R.sayT);hush();unwake();R=null;view='home';render();}

  const txt=fmt(Math.max(0,Math.ceil(s.dur-el-0.001)));big.textContent=txt;big.classList.toggle('long',txt.length>3);

 $('.run').classList.toggle('paused',R.paused);

 w.pace=PACE[w.pace]?w.pace:'medium';w.circuitRounds=n(w.circuitRounds,1,3);w.roundRest=n(w.roundRest,0,60);w.transition=n(w.transition,0,30);

 }
 if(view==='settings'&&t.dataset.s){
  const k=t.dataset.s;db.settings[k]=Number(t.value)||0;save();
  if(k==='volume'&&master)master.gain.value=db.settings.volume;
 }
});
$('#importFile').addEventListener('change',async e=>{
 const f=e.target.files[0];e.target.value='';if(!f)return;
 try{const d=JSON.parse(await f.text());if(!Array.isArray(d.workouts))throw 0;
  if(await ask(`Replace your workouts with the ${d.workouts.length} in this backup?`,'Replace')){db.workouts=d.workouts.map(normalize);if(d.settings)db.settings=Object.assign({},defaultSettings,d.settings);save();render();toast('Backup restored');}
 }catch(err){toast('That file is not a Rep Timer backup');}
});


render();
}
</script>
</body>
</html>
